<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Korean Quest</title>

<link rel="stylesheet" href="style.css">
<script src="questions.js"></script>

</head>
<body>

<div class="container">

<h1>🇰🇷 Korean Quest</h1>

<div id="level">
Level 1
</div>

<div id="streak">
🔥 Streak: 0
</div>

<br>

<button id="audioBtn" onclick="speakQuestion()">
🔊 音声を聞く
</button>

<h2 id="questionText">
音声を聞いて答えよう
</h2>

<div id="choices"></div>

<div id="result"></div>

<br>

<button id="nextBtn" onclick="nextQuestion()">
➡️ 次の問題
</button>

</div>

<script>

let currentQuestion = null;
let streak = 0;

function shuffle(array){
    return array.sort(() => Math.random() - 0.5);
}

function getRandomQuestion(){
    return quiz[Math.floor(Math.random() * quiz.length)];
}

function loadQuestion(){

    currentQuestion = getRandomQuestion();

    document.getElementById("questionText").innerHTML =
    "🔊 音声を聞いて答えよう";

    document.getElementById("result").innerHTML = "";

    const choicesDiv =
    document.getElementById("choices");

    choicesDiv.innerHTML = "";

    let answers = [currentQuestion.jp];

    while(answers.length < 4){

        const randomAnswer =
        quiz[Math.floor(Math.random()*quiz.length)].jp;

        if(!answers.includes(randomAnswer)){
            answers.push(randomAnswer);
        }
    }

    answers = shuffle(answers);

    answers.forEach(answer => {

        const btn =
        document.createElement("button");

        btn.className = "choice";

        btn.innerText = answer;

        btn.onclick = () =>
        checkAnswer(answer);

        choicesDiv.appendChild(btn);

    });

}

function checkAnswer(answer){

    if(answer === currentQuestion.jp){

        streak++;

        document.getElementById("result").innerHTML =
        "⭕ 正解！";

    }else{

        streak = 0;

        document.getElementById("result").innerHTML =
        "❌ 不正解<br>正解: " +
        currentQuestion.jp;

    }

    document.getElementById("streak").innerHTML =
    "🔥 Streak: " + streak;

}

function nextQuestion(){

    loadQuestion();

}

function speakQuestion(){

    if(!currentQuestion) return;

    speechSynthesis.cancel();

    const utterance =
    new SpeechSynthesisUtterance(
        currentQuestion.ko
    );

    utterance.lang = "ko-KR";
    utterance.rate = 0.9;

    speechSynthesis.speak(utterance);

}

loadQuestion();

</script>

</body>
</html>
