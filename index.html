<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Korean Quest</title>

<link rel="stylesheet" href="style.css">
<script src="questions.js"></script>

</head>
<body>

<div class="container">

<h1>🇰🇷 Korean Quest</h1>

<div id="level">
Level 1
</div>

<div id="streak">
🔥 Streak: 0
</div>

<br>

<button id="audioBtn" onclick="speakQuestion()">
🔊 音声を聞く
</button>

<h2 id="questionText">
音声を聞いて答えよう
</h2>

<div id="choices"></div>

<div id="result"></div>

<br>

<button id="nextBtn" onclick="nextQuestion()">
➡️ 次の問題
</button>

</div>

<script>

let currentQuestion = null;
let streak = 0;
let answered = false;
let reviewList = [];
let questionCount = 0;

function playCorrect(){
    const audio = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
    );
    audio.play();
}

function playWrong(){
    const audio = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    );
    audio.play();
}

function shuffle(array){
    return array.sort(() => Math.random() - 0.5);
}

function getQuestion(){

    questionCount++;

    for(let i = 0; i < reviewList.length; i++){

        reviewList[i].delay--;

        if(reviewList[i].delay <= 0){

            const reviewQuestion =
            reviewList[i].question;

            reviewList.splice(i,1);

            return reviewQuestion;
        }
    }

    return quiz[
        Math.floor(Math.random() * quiz.length)
    ];
}
function loadQuestion(){
    answered = false;
    currentQuestion = getQuestion();

    document.getElementById("questionText").innerHTML =
    "🔊 音声を聞いて答えよう";

    document.getElementById("result").innerHTML = "";

    const choicesDiv =
    document.getElementById("choices");

    choicesDiv.innerHTML = "";

    let answers = [currentQuestion.jp];

    while(answers.length < 4){

        const randomAnswer =
        quiz[Math.floor(Math.random()*quiz.length)].jp;

        if(!answers.includes(randomAnswer)){
            answers.push(randomAnswer);
        }
    }

    answers = shuffle(answers);

    answers.forEach(answer => {

        const btn =
        document.createElement("button");

        btn.className = "choice";

        btn.innerText = answer;

        btn.onclick = () =>
        checkAnswer(answer);

        choicesDiv.appendChild(btn);

    });

}

function checkAnswer(answer){

    if(answered) return;

    answered = true;

    const buttons =
    document.querySelectorAll(".choice");

    buttons.forEach(btn=>{
        btn.disabled = true;
    });

    if(answer === currentQuestion.jp){

        streak++;

        playCorrect();

        document.getElementById("result").innerHTML =
"⭕ 正解！<br><br>" +
"🇰🇷 " + currentQuestion.ko +
"<br>" +
"🇯🇵 " + currentQuestion.jp;

    }else{

        streak = 0;

        playWrong();

        reviewList.push({
    question: currentQuestion,
    delay: 3
});

        document.getElementById("result").innerHTML =
"❌ 不正解<br><br>" +
"🇰🇷 " + currentQuestion.ko +
"<br>" +
"🇯🇵 " + currentQuestion.jp;
    }

    document.getElementById("streak").innerHTML =
    "🔥 Streak: " + streak;
}

function nextQuestion(){

    loadQuestion();

}

function speakQuestion(){

    if(!currentQuestion) return;

    speechSynthesis.cancel();

    const utterance =
    new SpeechSynthesisUtterance(
        currentQuestion.ko
    );

    utterance.lang = "ko-KR";
    utterance.rate = 0.9;

    speechSynthesis.speak(utterance);

}

loadQuestion();

</script>

</body>

</html
